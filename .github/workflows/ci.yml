name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A hung plotting test would otherwise burn the full 6-hour default.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and viz extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz]"

      - name: Run tests
        # Plotting tests call plt.show(), which blocks forever on an
        # interactive backend. conftest.py forces Agg; MPLBACKEND is a second
        # line of defence in case a module imports pyplot before conftest runs.
        env:
          MPLBACKEND: Agg
        run: pytest -q

  import-without-viz:
    name: import without optional viz deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with no extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: matplotlib must not be required to import fluoropy
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("matplotlib") is None, (
              "matplotlib is installed; this job cannot prove it is optional"
          )

          import fluoropy

          # Plotting helpers are reachable but must raise a clear ImportError
          # rather than blowing up at import time.
          from fluoropy.core import plotting

          try:
              plotting._require_matplotlib()
          except ImportError as exc:
              assert "pip install fluoropy[viz]" in str(exc), exc
          else:
              raise AssertionError("expected ImportError without matplotlib")

          print("OK: fluoropy imports cleanly without matplotlib")
          PY
